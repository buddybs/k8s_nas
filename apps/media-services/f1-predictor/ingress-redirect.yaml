# F1 Predictor Ingress Redirect
# Redirects old path-based URL to new subdomain
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: f1-predictor-redirect
  namespace: media
  annotations:
    nginx.ingress.kubernetes.io/permanent-redirect: https://f1.home.brettswift.com
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - home.brettswift.com
    secretName: home-brettswift-com-tls
  rules:
  - host: home.brettswift.com
    http:
      paths:
      - path: /f1-predictor
        pathType: Prefix
        backend:
          service:
            name: f1-predictor
            port:
              number: 80
